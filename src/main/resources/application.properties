server.port=${PORT:8080}

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/seats}
spring.datasource.username=${DATABASE_USER:${USER:postgres}}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.sql.init.mode=always

# Health: liveness = process up; readiness = DB reachable (fails closed).
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.show-details=always

spring.jackson.property-naming-strategy=SNAKE_CASE

# One JSON object per log line; MDC (request_id, user_id, outcome, status, duration_ms) included.
logging.structured.format.console=logstash

# Under a stampede, requests should queue, not fail: bounded DB pool, long waits, big accept backlog.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.connection-timeout=120000
server.tomcat.max-connections=20000
server.tomcat.accept-count=5000
# Managed Postgres (Neon) drops idle connections; keepalive detects them before a request does.
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.max-lifetime=600000
# Threads beyond what the CPU/pool can run just context-switch; excess connections wait in the backlog.
server.tomcat.threads.max=${HTTP_THREADS:64}
