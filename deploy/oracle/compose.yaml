services:
  app:
    build:
      context: ../..
    restart: unless-stopped
    mem_limit: 512m
    cpus: 2
    env_file: ../../.env
    environment:
      PORT: 8080
      HTTP_THREADS: 64
      DB_POOL_SIZE: 10
    expose: ["8080"]
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    mem_limit: 512m
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?Set the public domain in .env}
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app]
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
volumes:
  caddy_data:
  caddy_config:
