server.port=${PORT:8080}
# Multiplex local HTTP/2 streams rather than allocating a TCP connection per pending request.
server.http2.enabled=true

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/seats}
spring.datasource.username=${DATABASE_USER:${USER:postgres}}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.sql.init.mode=always

# Health: liveness = process up; readiness = DB reachable (fails closed).
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.show-details=always

spring.jackson.property-naming-strategy=SNAKE_CASE

# One JSON object per log line; MDC (request_id, user_id, outcome, status, duration_ms) included.
logging.structured.format.console=logstash

# Keep database work bounded while pending HTTP/2 requests share connections.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.connection-timeout=120000
# Managed Postgres (Neon) drops idle connections; keepalive detects them before a request does.
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.max-lifetime=600000
server.undertow.threads.worker=${HTTP_THREADS:64}
server.undertow.threads.io=2
# Small request bodies should not retain large transport buffers while waiting for a worker.
server.undertow.buffer-size=1024
server.undertow.direct-buffers=true
server.undertow.options.server.NO_REQUEST_TIMEOUT=120000
