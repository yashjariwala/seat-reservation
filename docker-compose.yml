# Clean checkout -> `docker compose up --build` -> http://localhost:8080
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: seats
      POSTGRES_USER: seats
      POSTGRES_PASSWORD: seats
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seats"]
      interval: 2s
      retries: 30
  app:
    build: .
    ports: ["8080:8080"]
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/seats
      DATABASE_USER: seats
      DATABASE_PASSWORD: seats
    depends_on:
      db:
        condition: service_healthy
